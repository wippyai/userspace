version: "1.0"
namespace: app

entries:
  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database for user tests
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server
    addr: :19087
    lifecycle:
      auto_start: true

  - name: api.public
    kind: http.router
    meta:
      comment: Test public API router
      server: gateway
    prefix: /api/public

  - name: api
    kind: http.router
    meta:
      comment: Test authenticated API router
      server: gateway
    prefix: /api
    middleware:
      - token_auth
    options:
      token_store: userspace.user.security:tokens

  - name: test_user_scope
    kind: security.policy
    meta:
      comment: The default user group of the test app; /user/me runs with this scope and reads the database and env
    groups:
      - app.security:user
    policy:
      resources: "*"
      actions: "*"
      effect: allow

  - name: login_session_test
    kind: function.lua
    meta:
      type: test
      suite: user.login_session
    source: file://login_session_test.lua
    method: run
    modules:
      - sql
      - http_client
      - json
      - time
      - security
    imports:
      test: wippy.test:test
      user_repo: userspace.user.persist:user_repo

  - name: email_case_test
    kind: function.lua
    meta:
      type: test
      suite: user.email_case
    source: file://email_case_test.lua
    method: run
    modules:
      - sql
    imports:
      test: wippy.test:test
      user_repo: userspace.user.persist:user_repo
      user_groups_repo: userspace.user.persist:user_groups_repo

  - name: dep.userspace.users
    kind: ns.dependency
    meta:
      description: "Users module configuration for testing"
    component: "userspace/users"
    version: "*"
    parameters:
      - name: env_storage
        value: app:env_storage
      - name: userspace.user:public_router
        value: app:api.public
      - name: userspace.user:router
        value: app:api

  - name: dep.wippy.bootloader
    kind: ns.dependency
    meta:
      description: "Bootloader configuration for testing"
    component: "wippy/bootloader"
    version: "*"
    parameters:
      - name: application_host
        value: app:processes
      - name: env_storage
        value: app:env_storage

  - name: dep.wippy.migration
    kind: ns.dependency
    component: "wippy/migration"
    version: "*"
    parameters:
      - name: app_db
        value: app:db

  - name: dep.wippy.security
    kind: ns.dependency
    component: "wippy/security"
    version: "*"

  - name: dep.wippy.test
    kind: ns.dependency
    component: "wippy/test"
    version: "*"
