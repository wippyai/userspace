version: "1.0"
namespace: app

entries:
  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database for uploads tests
    file: ":memory:"

  - name: uploads
    kind: fs.directory
    meta:
      comment: Local file storage for upload tests
    directory: ./.wippy/test_uploads

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server
    addr: :19086
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      comment: Test API router
      server: gateway
    prefix: /api

  - name: api.public
    kind: http.router
    meta:
      comment: Test public API router
      server: gateway
    prefix: /api/public

  - name: encryption_key
    kind: env.variable
    readonly: false
    storage: app:env_storage
    default: "046e5a0594bb339ef5ddcd8c3a9b9b828ed066d53ee99138ec6da8795e38b55d"

  - name: dep.userspace.uploads
    kind: ns.dependency
    meta:
      description: "Uploads module configuration for testing"
    component: "userspace/uploads"
    parameters:
      - name: database_resource
        value: app:db
      - name: storage_id
        value: app:uploads
      - name: env_storage
        value: app:env_storage
      - name: router
        value: app:api

  - name: dep.wippy.session
    kind: ns.dependency
    meta:
      description: "Session module configuration for testing (wires env_storage so the file_provider contract loads)"
    component: "wippy/session"
    parameters:
      - name: database_resource
        value: app:db
      - name: env_storage
        value: app:env_storage
      - name: api_router
        value: app:api.public

  - name: dep.wippy.llm
    kind: ns.dependency
    meta:
      description: "LLM module configuration for testing"
    component: "wippy/llm"
    parameters:
      - name: process_host
        value: app:processes
      - name: env_storage
        value: app:env_storage

  - name: dep.wippy.views
    kind: ns.dependency
    meta:
      description: "Views module for rendering"
    component: "wippy/views"
    parameters:
      - name: api_router
        value: app:api.public
      - name: env_storage
        value: app:env_storage

  - name: dep.wippy.bootloader
    kind: ns.dependency
    meta:
      description: "Bootloader configuration for testing"
    component: "wippy/bootloader"
    parameters:
      - name: application_host
        value: app:processes
      - name: env_storage
        value: app:env_storage

  - name: file_provider_test
    kind: function.lua
    meta:
      name: Uploads file_provider compliance
      type: test
      suite: uploads
    source: file://file_provider_test.lua
    modules:
      - contract
    imports:
      test: wippy.test:test
    method: run

  - name: upload_tokens_test
    kind: function.lua
    meta:
      name: Upload tokens
      type: test
      suite: uploads
      comment: Tests for upload completion token pack/unpack
    source: file://upload_tokens_test.lua
    modules:
      - base64
    imports:
      upload_tokens: userspace.uploads:upload_tokens
      test: wippy.test:test
    method: run

  - name: multipart_test
    kind: function.lua
    meta:
      name: Multipart uploads
      type: test
      suite: uploads
      comment: Validation and ownership paths of the multipart upload lifecycle
    source: file://multipart_test.lua
    modules:
      - uuid
    imports:
      upload_lib: userspace.uploads:upload_lib
      upload_repo: userspace.uploads:upload_repo
      uploads_resources: userspace.uploads:uploads_resources
      test: wippy.test:test
    method: run

  - name: type.deferable
    kind: registry.entry
    meta:
      type: upload.type
      name: Defer test type
      comment: Pipeline exercising a deferring stage between two normal stages
    extensions:
      - dfr
    mime_types:
      - application/x-defer-test
    pipeline:
      - title: Stage One
        func: app:stage_one
      - title: Deferring Stage
        func: app:stage_defer
      - title: Stage Three
        func: app:stage_three

  - name: type.defer_then_fail
    kind: registry.entry
    meta:
      type: upload.type
      name: Defer-then-fail test type
      comment: Pipeline where the stage after the deferring one always fails
    extensions:
      - dff
    mime_types:
      - application/x-defer-fail-test
    pipeline:
      - title: Stage One
        func: app:stage_one
      - title: Deferring Stage
        func: app:stage_defer
      - title: Failing Stage
        func: app:stage_fail

  - name: stage_one
    kind: function.lua
    meta:
      comment: Test pipeline stage recording its run count
    source: file://pipeline_stages.lua
    method: stage_one

  - name: stage_defer
    kind: function.lua
    meta:
      comment: Test pipeline stage deferring on its first pass
    source: file://pipeline_stages.lua
    method: stage_defer

  - name: stage_fail
    kind: function.lua
    meta:
      comment: Test pipeline stage that always raises
    source: file://pipeline_stages.lua
    method: stage_fail

  - name: stage_three
    kind: function.lua
    meta:
      comment: Test pipeline stage recording its run count
    source: file://pipeline_stages.lua
    method: stage_three

  - name: pipeline_defer_test
    kind: function.lua
    meta:
      name: Pipeline defer and resume
      type: test
      suite: uploads
      comment: Deferred stages park the upload in processing and resume from the recorded stage
    source: file://pipeline_defer_test.lua
    modules:
      - uuid
    imports:
      pipeline_lib: userspace.uploads:pipeline_lib
      upload_repo: userspace.uploads:upload_repo
      test: wippy.test:test
    method: run
