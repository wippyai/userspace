version: "1.0"
namespace: userspace.uploads.env

entries:
  # userspace.uploads.env:database_resource
  - name: database_resource
    kind: env.variable
    meta:
      comment: Database resource for uploads storage
      icon: tabler:database
      private: true
    default: app:db

  # userspace.uploads.env:storage_id
  - name: storage_id
    kind: env.variable
    meta:
      comment: Storage service ID for file uploads
      icon: tabler:upload
      private: true
    default: app:uploads

  # userspace.uploads.env:storage_s3
  - name: storage_s3
    kind: env.variable
    meta:
      comment: S3 cloud storage service ID for presigned uploads
      icon: tabler:cloud-upload
      private: true
    default: app:uploads.s3

  # userspace.uploads.env:recovery_stale_after
  - name: recovery_stale_after
    kind: env.variable
    meta:
      comment: Inactivity after which a processing upload counts as interrupted (Go duration)
      icon: tabler:clock-pause
      private: true
    default: "30m"

  # userspace.uploads.env:recovery_interval
  - name: recovery_interval
    kind: env.variable
    meta:
      comment: How often recovery looks for interrupted uploads; 0 disables the periodic sweep (Go duration)
      icon: tabler:refresh
      private: true
    default: "5m"

  # userspace.uploads.env:recovery_max_attempts
  - name: recovery_max_attempts
    kind: env.variable
    meta:
      comment: How many times an interrupted upload is re-queued before it is marked failed
      icon: tabler:repeat
      private: true
    default: "3"
