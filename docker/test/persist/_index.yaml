version: "1.0"
namespace: app.persist

entries:
  - name: images_test
    kind: function.lua
    meta:
      type: test
      suite: docker
      description: Images persistence layer tests
    source: file://images_test.lua
    method: run_tests
    imports:
      images_repo: userspace.docker.persist:images
      test: wippy.test:test
    modules:
      - sql
      - env

  - name: containers_test
    kind: function.lua
    meta:
      type: test
      suite: docker
      description: Container persistence layer tests
    source: file://containers_test.lua
    method: run_tests
    imports:
      containers_repo: userspace.docker.persist:containers
      test: wippy.test:test
    modules:
      - sql
      - env

  - name: log_cursor_migration_test
    kind: function.lua
    meta:
      type: test
      suite: docker-migrations
      description: Log cursor migration backfills large SQLite histories
      timeout: 600s
    source: file://log_cursor_migration_test.lua
    method: run_tests
    imports:
      runner: wippy.migration:runner
      test: wippy.test:test
    modules:
      - sql
      - time
