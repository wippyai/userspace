version: "1.0"
namespace: app

entries:
  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database for docker tests
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: dep.userspace.docker
    kind: ns.dependency
    meta:
      description: Docker module configuration for testing
    component: userspace/docker
    version: ">=0.5.4"
    parameters:
      - name: database
        value: app:db
      - name: process_host
        value: app:processes

  - name: dep.wippy.bootloader
    kind: ns.dependency
    meta:
      description: Bootloader configuration for testing
    component: wippy/bootloader
    version: ">=0.3.0"
    parameters:
      - name: application_host
        value: app:processes
      - name: env_storage
        value: app:env_storage

  - name: dep.wippy.migration
    kind: ns.dependency
    meta:
      description: Migration runner, applies the docker schema to app:db
    component: wippy/migration
    version: ">=0.3.14"
    parameters:
      - name: app_db
        value: app:db

  - name: dep.wippy.security
    kind: ns.dependency
    meta:
      description: Security policies (the process policy group supervised services declare)
    component: wippy/security
    version: ">=0.4.1"

  - name: client_test
    kind: function.lua
    meta:
      type: test
      suite: docker
      description: Docker client parse_logs and protocol tests
    source: file://client_test.lua
    method: run_tests
    imports:
      docker_client: userspace.docker:docker_client
      test: wippy.test:test
    modules:
      - time

  - name: registry_test
    kind: function.lua
    meta:
      type: test
      suite: docker
      description: Registry event subscription tests for dynamic container pickup
    source: file://registry_test.lua
    method: run_tests
    imports:
      test: wippy.test:test
    modules:
      - events
      - channel
      - time

  - name: e2e_test
    kind: function.lua
    meta:
      type: test
      suite: docker-e2e
      description: Docker client end-to-end tests (requires WIPPY_E2E=1 and Docker)
      timeout: 300s
    source: file://e2e_test.lua
    method: run_tests
    imports:
      docker_client: userspace.docker:docker_client
      spec: userspace.docker.lib:spec
      test: wippy.test:test
    modules:
      - env
      - time
      - contract
