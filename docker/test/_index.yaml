version: "1.0"
namespace: app

entries:
  - name: pty_config
    kind: process.lua
    source: file://pty_config.lua
    method: main
    modules: [io, json, contract]
    imports: {runtime: userspace.docker.narrow:runtime}
    security:
      actor: {id: app:pty_config}
      policies: [app:pty_contract_access, app:pty_contract_methods]
    meta:
      command: {name: docker-pty-config}

  - name: pty_config_test
    kind: function.lua
    source: file://pty_config.lua
    method: main
    modules: [io, json, contract]
    imports: {runtime: userspace.docker.narrow:runtime}
    security:
      actor: {id: app:pty_config_test}
      policies: [app:pty_contract_access, app:pty_contract_methods]
    meta:
      type: test
      suite: docker
      description: Explicit terminal mode, no-start create, and unchanged sandbox validation

  - name: pty_contract
    kind: process.lua
    source: file://pty_contract.lua
    method: main
    modules: [contract, env, io]
    imports: {docker_client: userspace.docker:docker_client}
    security:
      actor: {id: app:pty_contract}
      policies: [app:pty_contract_access, app:pty_contract_methods, app:pty_daemon_access, app:pty_daemon_socket]
    meta:
      command: {name: docker-pty-contract}

  - name: pty_contract_access
    kind: security.policy
    policy:
      resources: [userspace.docker:narrow, userspace.docker:narrow_binding]
      actions: [contract.get, contract.open]
      effect: allow

  - name: pty_contract_methods
    kind: security.policy
    policy:
      resources: [create, start]
      actions: [contract.call]
      effect: allow

  - name: pty_daemon_access
    kind: security.policy
    policy:
      resources: ['http://docker/*', WIPPY_DOCKER_PTY_IMAGE, WIPPY_DOCKER_PTY_ROOT]
      actions: [http_client.request, env.get]
      effect: allow

  - name: pty_daemon_socket
    kind: security.policy
    policy:
      resources: ['/var/run/docker.sock']
      actions: [http_client.unix_socket]
      effect: allow

  - name: WIPPY_DOCKER_PTY_IMAGE
    kind: env.variable
    variable: WIPPY_DOCKER_PTY_IMAGE
    storage: userspace.docker:os_env

  - name: WIPPY_DOCKER_PTY_ROOT
    kind: env.variable
    variable: WIPPY_DOCKER_PTY_ROOT
    storage: userspace.docker:os_env

  - name: observed_identity
    kind: process.lua
    source: file://observed_identity.lua
    method: main
    modules: [io]
    imports: {runtime: userspace.docker.narrow:runtime}
    meta:
      command: {name: docker-observed-identity}

  - name: remove_observation
    kind: process.lua
    source: file://remove_observation.lua
    method: main
    modules: [io]
    imports: {runtime: userspace.docker.narrow:runtime}
    meta:
      command: {name: docker-remove-observation}

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database for docker tests
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: dep.userspace.docker
    kind: ns.dependency
    meta:
      description: Docker module configuration for testing
    component: userspace/docker
    version: ">=0.5.4"
    parameters:
      - name: database
        value: app:db
      - name: process_host
        value: app:processes

  - name: dep.wippy.bootloader
    kind: ns.dependency
    meta:
      description: Bootloader configuration for testing
    component: wippy/bootloader
    version: ">=0.3.0"
    parameters:
      - name: application_host
        value: app:processes
      - name: env_storage
        value: app:env_storage

  - name: dep.wippy.migration
    kind: ns.dependency
    meta:
      description: Migration runner, applies the docker schema to app:db
    component: wippy/migration
    version: ">=0.3.14"
    parameters:
      - name: app_db
        value: app:db

  - name: dep.wippy.security
    kind: ns.dependency
    meta:
      description: Security policies (the process policy group supervised services declare)
    component: wippy/security
    version: ">=0.4.1"

  - name: client_test
    kind: function.lua
    meta:
      type: test
      suite: docker
      description: Docker client parse_logs and protocol tests
    source: file://client_test.lua
    method: run_tests
    imports:
      docker_client: userspace.docker:docker_client
      test: wippy.test:test
    modules:
      - time

  - name: registry_test
    kind: function.lua
    meta:
      type: test
      suite: docker
      description: Registry event subscription tests for dynamic container pickup
    source: file://registry_test.lua
    method: run_tests
    imports:
      test: wippy.test:test
    modules:
      - events
      - channel
      - time

  - name: e2e_test
    kind: function.lua
    meta:
      type: test
      suite: docker-e2e
      description: Docker client end-to-end tests (requires WIPPY_E2E=1 and Docker)
      timeout: 300s
    source: file://e2e_test.lua
    method: run_tests
    imports:
      docker_client: userspace.docker:docker_client
      spec: userspace.docker.lib:spec
      tar: userspace.docker.lib:tar
      test: wippy.test:test
    modules:
      - env
      - time
      - contract
