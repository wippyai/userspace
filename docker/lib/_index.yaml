version: "1.0"
namespace: userspace.docker.lib

entries:
  - name: consts
    kind: library.lua
    source: file://consts.lua

  - name: spec
    kind: library.lua
    source: file://spec.lua

  - name: tar
    kind: library.lua
    source: file://tar.lua

  - name: helpers
    kind: library.lua
    source: file://helpers.lua
    modules:
      - json
      - process

  - name: reclaim
    kind: library.lua
    source: file://reclaim.lua

  - name: images
    kind: library.lua
    source: file://images.lua

  - name: reconcile
    kind: library.lua
    source: file://reconcile.lua
    imports:
      consts: userspace.docker.lib:consts

  - name: log_watch
    kind: library.lua
    source: file://log_watch.lua
    imports:
      docker_client: userspace.docker:docker_client
