version: "1.0"
namespace: userspace.docker.service

entries:
  - name: root
    kind: process.lua
    source: file://root.lua
    method: run
    imports:
      consts: userspace.docker.lib:consts
      helpers: userspace.docker.lib:helpers
      containers_repo: userspace.docker.persist:containers
      interactive_routes: userspace.docker.service:interactive_executor_routes
    modules:
      - sql
      - registry
      - process
      - channel
      - time
      - json
      - logger
      - env
      - events

  - name: root.service
    kind: process.service
    process: root
    host: process_host
    lifecycle:
      auto_start: true
      restart:
        max_attempts: 3

  - name: worker
    kind: process.lua
    source: file://worker.lua
    method: run
    imports:
      consts: userspace.docker.lib:consts
      helpers: userspace.docker.lib:helpers
      spec: userspace.docker.lib:spec
      reclaim: userspace.docker.lib:reclaim
      images: userspace.docker.lib:images
      containers_repo: userspace.docker.persist:containers
      docker_client: userspace.docker:docker_client
      interactive_routes: userspace.docker.service:interactive_executor_routes
    modules:
      - sql
      - exec
      - process
      - channel
      - time
      - json
      - logger
      - registry

  - name: interactive_executor_routes
    kind: library.lua
    source: file://interactive_executor_routes.lua

  - name: interactive_executor_routes_test
    kind: function.lua
    meta:
      type: test
      suite: docker
      description: Interactive executor routes fail closed and preserve exact Docker image identity
    source: file://interactive_executor_routes_test.lua
    method: run_tests
    imports:
      routes: userspace.docker.service:interactive_executor_routes
      test: wippy.test:test

  - name: monitor
    kind: process.lua
    source: file://monitor.lua
    method: run
    imports:
      consts: userspace.docker.lib:consts
      containers_repo: userspace.docker.persist:containers
      docker_client: userspace.docker:docker_client
      reconcile: userspace.docker.lib:reconcile
    modules:
      - sql
      - process
      - channel
      - time
      - registry
      - logger

  - name: image_builder
    kind: process.lua
    source: file://image_builder.lua
    method: run
    imports:
      consts: userspace.docker.lib:consts
      helpers: userspace.docker.lib:helpers
      images_repo: userspace.docker.persist:images
      tar: userspace.docker.lib:tar
      docker_client: userspace.docker:docker_client
    modules:
      - sql
      - process
      - channel
      - time
      - json
      - logger

  - name: log_streamer
    kind: process.lua
    source: file://log_streamer.lua
    method: run
    imports:
      consts: userspace.docker.lib:consts
      helpers: userspace.docker.lib:helpers
      containers_repo: userspace.docker.persist:containers
    modules:
      - sql
      - env
      - process
      - channel
      - time
      - json

  - name: build_log_streamer
    kind: process.lua
    source: file://build_log_streamer.lua
    method: run
    imports:
      consts: userspace.docker.lib:consts
      helpers: userspace.docker.lib:helpers
      images_repo: userspace.docker.persist:images
    modules:
      - sql
      - env
      - process
      - channel
      - time
      - json
